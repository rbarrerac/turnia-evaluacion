# Módulo: Configuración del análisis estático con SonarQube / SonarScanner
# Proyecto: Turnia
# Autor: Luis
# Fecha de creación: 07/10/2026
#
# Solo configuración: SonarQube y el scanner no forman parte del repositorio.
# Antes de analizar, generar la cobertura del backend (cd api && npm run cobertura)
# para que exista api/coverage/lcov.info.

sonar.projectKey=turnia
sonar.projectName=Turnia
sonar.sourceEncoding=UTF-8

# Código fuente y pruebas
sonar.sources=api/src,web/src
sonar.tests=api/pruebas

# Cobertura del backend (reporte lcov de Jest)
sonar.javascript.lcov.reportPaths=api/coverage/lcov.info

# Exclusiones: dependencias, reportes generados, compilados y fotos subidas
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,api/almacenamiento/**

# Módulo: Configuración de Nginx — sirve el frontend y hace de proxy inverso hacia la API
# Proyecto: Turnia
# Autor: Luis
# Fecha de creación: 08/10/2026
#
# Se copia en /etc/nginx/conf.d/default.conf de la imagen nginx:1.27-alpine.
# El frontend y la API quedan bajo el mismo origen (https://<servidor>/), por eso el
# navegador no necesita CORS: /api/ y /archivos/ se reenvían al contenedor "api".

# ---------- Puerto 80: redirección a HTTPS ----------
server {
    listen 80;
    server_name _;

    # Verificación de salud del contenedor (healthcheck de Docker): responde sin redirigir.
    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- Puerto 443: sitio en HTTPS ----------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certificados/turnia.crt;
    ssl_certificate_key /etc/nginx/certificados/turnia.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Las fotos de la galería admiten hasta 5 MB (multer); se deja margen para el multipart.
    client_max_body_size 6m;

    # Encabezados de seguridad básicos (se heredan en las location que no definen add_header).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # La dirección de la API se resuelve en cada petición con el DNS interno de Docker
    # (127.0.0.11) y no una sola vez al arrancar: así Nginx no se cae si arranca antes que
    # la API (por ejemplo, al reiniciar la Pi) y sigue funcionando si el contenedor de la
    # API se recrea con otra IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_turnia http://api:4000;

    root  /usr/share/nginx/html;
    index index.html;

    # API REST
    location /api/ {
        proxy_pass $api_turnia;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fotos de la galería de trabajos (estáticos servidos por la API desde el volumen)
    location /archivos/ {
        proxy_pass $api_turnia;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Recursos del build de Vite: llevan un hash en el nombre, así que se pueden guardar
    # en caché mucho tiempo. "expires" no usa add_header, así que no anula los de arriba.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta (p. ej. /reservar/<id>) la resuelve React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
